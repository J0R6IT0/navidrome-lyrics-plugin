[package]
name = "navidrome-lyrics-plugin"
version = "8.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
extism-pdk = "1"
flate2 = "1"
getrandom = "0.2"
nd-pdk = { git = "https://github.com/navidrome/navidrome", subdir = "plugins/pdk/rust/nd-pdk" }
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
